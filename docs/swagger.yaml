host: https://platform-api.string-api.xyz
info:
  contact:
    email: support@stringxyz.com
    name: Platform Management API Support
    url: http://string.xyz
  description: Platform Management API for managing Organizations, Platforms, API
    keys, etc.
  title: Platform Management API
  version: "1.0"
paths:
  /apikeys:
    get:
      consumes:
      - application/json
      description: Get all API keys
      parameters:
      - description: Platform ID
        in: query
        name: platformId
        type: string
      - description: Limit the number of returned results
        in: query
        name: limit
        type: integer
      - description: Offset the starting point of returned results
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Apikey'
            type: array
      security:
      - JWTAuth: []
      summary: Get all API keys
      tags:
      - Apikey
    post:
      consumes:
      - application/json
      description: Create an API key
      parameters:
      - description: Type of API key (public or secret)
        in: query
        name: type
        type: string
      - description: Platform ID
        in: query
        name: platformId
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Apikey'
      security:
      - JWTAuth: []
      summary: Create API key
      tags:
      - Apikey
  /apikeys/{id}:
    delete:
      consumes:
      - application/json
      description: Delete API key by ID
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - JWTAuth: []
      summary: Delete API key
      tags:
      - Apikey
    get:
      consumes:
      - application/json
      description: Get API key by ID
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Apikey'
      security:
      - JWTAuth: []
      summary: Get API key
      tags:
      - Apikey
    put:
      consumes:
      - application/json
      description: Update API key by ID
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      - description: API key description
        in: body
        name: description
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Apikey'
      security:
      - JWTAuth: []
      summary: Update API key
      tags:
      - Apikey
