name: deploy to development
permissions:
  id-token: write
  contents: read
on: 
  push:
    branches: [develop]
jobs:
  deploy:
    environment: 
      name: development
      url: https://platform-api.dev.string-api.xyz

    name: build push and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: setup go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: install deps
        run: |
          go mod download
      
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v1.6.1
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.ASSUME_ROLE }}

      - name: login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
  
      - name: build, tag and push to Amazon ECR
        env:
          ECR_REPO: ${{ secrets.AWS_ACCT }}.dkr.ecr.us-west-2.amazonaws.com
          SERVICE: platform-api
          IMAGE_TAG: latest
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./cmd/app/main ./cmd/app/main.go
          docker build --platform linux/amd64 -t $ECR_REPO/$SERVICE:$IMAGE_TAG ./cmd/app/
          docker push $ECR_REPO/$SERVICE:$IMAGE_TAG

      - name: deploy
        env:
          CLUSTER: string-core
          SERVICE: platform-api
          AWS_REGION: us-west-2
        run: |
          aws ecs --region $AWS_REGION update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
  rdme-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo 📚
        uses: actions/checkout@v3

      - name: Set up Go environment
        uses: actions/setup-go@v2
        with:
          go-version: 1.19

      - name: Run `swag init` command 📦
        run: |
          go get -u github.com/swaggo/swag/cmd/swag
          swag init -g /api/api.go

      - name: Run `openapi` command 🚀
        uses: readmeio/rdme@v8
        with:
          rdme: openapi docs/swagger.yaml --key=${{ secrets.README_API_KEY }} --id=64595576698e26003dae4baa